<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <title>No album art</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#181818"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#background)"/>
  <!-- A record: grooves, then the label and its spindle hole -->
  <circle cx="150" cy="150" r="96" fill="#121212"/>
  <circle cx="150" cy="150" r="84" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <circle cx="150" cy="150" r="70" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <circle cx="150" cy="150" r="56" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <circle cx="150" cy="150" r="32" fill="#21cc06"/>
  <circle cx="150" cy="150" r="6" fill="#121212"/>
</svg>
