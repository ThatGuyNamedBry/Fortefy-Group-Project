    <rect x="200" y="82" width="10" height="94"/>
    <ellipse cx="119" cy="196" rx="24" ry="17" transform="rotate(-20 119 196)"/>
    <ellipse cx="187" cy="176" rx="24" ry="17" transform="rotate(-20 187 176)"/>
